<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Login</title>
</head>
<body>
    <section class="formContainer">
        <form action="">
            <div id="header">
                <h1>Welcome Back</h1>
                <p>Access your donor portal to track your impact.</p>
            </div>

            <div class="tContainer">
                <label for="email">EMAIL ADDRESS</label>
                <input type="text" name="email" id="email">
            </div>
            
            <div class="tContainer">
                <div style="display: flex;justify-content: space-between;">
                    <label for="password" >PASSWORD</label>
                    <a href="" style="color:#B9172F;">Forgot Password?</a>
                </div>
                <input type="password" name="password" id="password">
            </div>
            <button type="submit" >Login to Portal →</button>
            <div class="divider">OR</div>
            <a href="Registration.html" id="signup">Don't have an account?Sign Up</a>
            <div class="divider" id="divider2"></div>
        </form>
    </section>
</body>
</html>
